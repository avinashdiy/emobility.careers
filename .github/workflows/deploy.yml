name: Build & deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma:generate
      - run: pnpm prisma validate
      - run: pnpm typecheck
      - run: pnpm lint
        continue-on-error: true   # surface lint warnings without blocking deploys

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/emobility-careers
            docker compose -f docker/docker-compose.prod.yml pull
            # Run migrations FIRST against the new image, before swapping traffic.
            # `run --rm` spins up a transient container with the latest image.
            docker compose -f docker/docker-compose.prod.yml run --rm web \
              npx prisma migrate deploy
            docker compose -f docker/docker-compose.prod.yml up -d --remove-orphans
            # Wait for healthcheck to go green before pruning old images.
            for i in $(seq 1 12); do
              if docker compose -f docker/docker-compose.prod.yml ps web --format json \
                | grep -q '"Health":"healthy"'; then
                echo "web is healthy"; break
              fi
              echo "waiting for web ($i)..."; sleep 5
            done
            docker image prune -af
