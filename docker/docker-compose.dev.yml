# Local development services for emobility.careers
# Run: pnpm docker:up    →    pnpm dev (in another terminal)

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: emce-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: emce
      POSTGRES_PASSWORD: emce_dev
      POSTGRES_DB: emce
    ports:
      - "5432:5432"
    volumes:
      - emce-postgres:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emce -d emce"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: emce-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - emce-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: emce-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: emce_minio
      MINIO_ROOT_PASSWORD: emce_minio_dev
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - emce-minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    container_name: emce-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 emce_minio emce_minio_dev;
      mc mb -p local/emce-resumes local/emce-avatars local/emce-logos local/emce-docs;
      mc anonymous set download local/emce-avatars;
      mc anonymous set download local/emce-logos;
      exit 0;
      "

  soketi:
    image: quay.io/soketi/soketi:1.6-16-alpine
    container_name: emce-soketi
    restart: unless-stopped
    environment:
      SOKETI_DEBUG: "1"
      SOKETI_DEFAULT_APP_ID: emce
      SOKETI_DEFAULT_APP_KEY: emce_pusher_key
      SOKETI_DEFAULT_APP_SECRET: emce_pusher_secret
    ports:
      - "6001:6001"
      - "9601:9601" # metrics

volumes:
  emce-postgres:
  emce-redis:
  emce-minio:
